version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    rebase-strategy: disabled

    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      github-actions-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action/*"
        update-types:
          - "minor"
          - "patch"

    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: daily

    groups:
      go-modules-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
